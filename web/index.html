<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>nVoice</title>
    <link rel="stylesheet" href="/nui/css/nui-theme.css">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        nui-app:not(.nui-ready) { display: none; }
        nui-loading:not(.active) { display: none; }
    </style>
    <script type="module" src="/nui/nui.js"></script>
    <script src="/sdk/ort.js"></script>
    <script src="/sdk/nVoiceClient.js"></script>
    <script type="module" src="/js/app.js"></script>
</head>
<body>
    <nui-loading mode="bar"></nui-loading>

    <nui-app content-min-width="50rem">
        <nui-skip-links></nui-skip-links>

        <nui-app-header>
            <header>
                <div slot="left">
                    <nui-button data-action="toggle-sidebar" variant="icon">
                        <button type="button" aria-label="Toggle navigation menu">
                            <nui-icon name="menu">☰</nui-icon>
                        </button>
                    </nui-button>
                    <nui-select id="engine-switcher" class="nv-engine-select" aria-label="Active engine">
                        <select>
                            <option value="" disabled selected>Loading engines...</option>
                        </select>
                    </nui-select>
                </div>

                <div slot="right">
                    <nui-button data-action="toggle-theme" variant="icon">
                        <button type="button" aria-label="Toggle light/dark theme">
                            <nui-icon name="brightness">⛭</nui-icon>
                        </button>
                    </nui-button>
                </div>
            </header>
        </nui-app-header>

        <nui-loading id="engine-busy" mode="overlay">Switching engine...</nui-loading>

        <nui-sidebar behavior="primary" id="nav-sidebar">
            <nav>
                <nui-link-list mode="fold" id="main-navigation"></nui-link-list>
            </nav>
        </nui-sidebar>

        <nui-content>
            <nui-main></nui-main>
        </nui-content>
    </nui-app>
</body>
</html>
