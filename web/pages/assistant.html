<div class="page-assistant">
    <header style="margin-bottom: var(--nui-space-double)">
        <h1>Voice Assistant</h1>
        <p class="lead">Speak naturally — the raw transcript appears instantly. After a longer pause, the cleaned transcript updates below.</p>
    </header>

    <nui-card>
        <div class="nv-section">
            <div style="display: flex; align-items: center; gap: var(--nui-space); margin-bottom: var(--nui-space);">
                <nui-badge id="asst-status-badge">Disconnected</nui-badge>
                <span id="asst-telemetry" class="nv-dim" style="font-family: monospace; font-size: 0.8em;"></span>
            </div>

            <div class="nv-form-stack">
                <nui-input-group>
                    <label for="asst-mic-select">Input source</label>
                    <nui-select id="asst-mic-select-wrap">
                        <select id="asst-mic-select"></select>
                    </nui-select>
                </nui-input-group>

                <div class="nv-options-row">
                    <nui-checkbox>
                        <input type="checkbox" id="asst-wake-word-toggle" checked>
                        <label for="asst-wake-word-toggle">Wake-on-Voice (WASM)</label>
                    </nui-checkbox>

                    <nui-checkbox>
                        <input type="checkbox" id="asst-kimi-toggle">
                        <label for="asst-kimi-toggle">"ok kimi" (worker detector)</label>
                    </nui-checkbox>

                    <nui-checkbox>
                        <input type="checkbox" id="asst-raw-audio-toggle">
                        <label for="asst-raw-audio-toggle">Raw audio (disable AGC/noise suppression)</label>
                    </nui-checkbox>
                </div>
            </div>

            <nui-button-container class="nv-actions" gap="medium">
                <nui-button variant="primary" id="asst-btn-start">
                    <button type="button">Start</button>
                </nui-button>
                <nui-button variant="danger" id="asst-btn-stop">
                    <button type="button" disabled>Stop</button>
                </nui-button>
                <nui-button id="asst-btn-sleep">
                    <button type="button" disabled>Go to Sleep</button>
                </nui-button>
                <nui-button id="asst-btn-copy">
                    <button type="button" disabled>Copy Cleaned</button>
                </nui-button>
            </nui-button-container>
        </div>

        <div class="nv-assistant-columns">
            <div class="nv-assistant-col">
                <h3 style="margin: 0 0 var(--nui-space-quarter) 0; font-size: 1em;">Raw Transcript</h3>
                <div id="asst-raw" class="nv-log nv-transcript"></div>
            </div>

            <div class="nv-assistant-col">
                <h3 style="margin: 0 0 var(--nui-space-quarter) 0; font-size: 1em;">Cleaned Transcript <span id="asst-cleanup-latency" class="nv-dim" style="font-weight: normal; font-size: 0.85em;"></span></h3>
                <div id="asst-cleaned" class="nv-log nv-assistant-log"></div>
            </div>
        </div>

        <!-- Conversation — user dictation bubbles (right) + assistant reply bubbles (left) -->
        <h3 style="margin: var(--nui-space-double) 0 0 0; font-size: 1em;">Conversation</h3>
        <div id="asst-chat" class="nv-chat"></div>

        <!-- Handsfree Phase 1 harness: button stands in for the "ok kimi" wake word -->
        <div style="margin-top: var(--nui-space); display: flex; gap: var(--nui-space); align-items: flex-start;">
            <nui-button variant="primary" id="asst-btn-send">
                <button type="button" disabled>Send (handsfree)</button>
            </nui-button>
            <div id="asst-reply" class="nv-log" style="flex: 1; min-height: 4rem; max-height: 10rem; margin-top: 0;"></div>
        </div>
    </nui-card>
</div>

<script type="nui/page">
function init(element, params, nui) {
    const startBtn = element.querySelector('#asst-btn-start');
    const stopBtn = element.querySelector('#asst-btn-stop');
    const sleepBtn = element.querySelector('#asst-btn-sleep');
    const copyBtn = element.querySelector('#asst-btn-copy');
    const startInnerBtn = startBtn.querySelector('button');
    const stopInnerBtn = stopBtn.querySelector('button');
    const sleepInnerBtn = sleepBtn.querySelector('button');
    const copyInnerBtn = copyBtn.querySelector('button');
    const statusBadge = element.querySelector('#asst-status-badge');
    const rawDiv = element.querySelector('#asst-raw');
    const cleanedDiv = element.querySelector('#asst-cleaned');
    const cleanupLatencyDiv = element.querySelector('#asst-cleanup-latency');
    const telemetryDiv = element.querySelector('#asst-telemetry');
    const micSelect = element.querySelector('#asst-mic-select');
    const micSelectWrap = element.querySelector('#asst-mic-select-wrap');
    const wakeWordToggle = element.querySelector('#asst-wake-word-toggle');
    const kimiToggle = element.querySelector('#asst-kimi-toggle');
    const rawAudioToggle = element.querySelector('#asst-raw-audio-toggle');
    const sendBtn = element.querySelector('#asst-btn-send');
    const sendInnerBtn = sendBtn.querySelector('button');
    const replyDiv = element.querySelector('#asst-reply');
    const chatDiv = element.querySelector('#asst-chat');

    let client = null;
    let rawText = '';  // accumulated final transcripts, sent on handsfree Send

    async function loadInputSources() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stream.getTracks().forEach(t => t.stop());
            const devices = await navigator.mediaDevices.enumerateDevices();
            const audioInputDevices = devices.filter(d => d.kind === 'audioinput');
            const items = audioInputDevices.map((device, i) => ({
                value: device.deviceId,
                label: device.label || `Microphone ${i + 1}`,
            }));
            if (items.length === 0) {
                micSelectWrap.setItems([{ value: '', label: 'No microphones found' }]);
                return;
            }
            micSelectWrap.setItems(items);
            micSelectWrap.setValue?.(items[0].value);
        } catch (err) {
            micSelectWrap.setItems([{ value: '', label: 'Microphone permission denied' }]);
        }
    }

    element.show = () => { loadInputSources(); };
    loadInputSources();

    function setMicEnabled(enabled) {
        micSelect.disabled = !enabled;
        wakeWordToggle.disabled = !enabled;
        kimiToggle.disabled = !enabled;
    }

    function setStatus(text, variant) {
        statusBadge.textContent = text;
        if (variant) statusBadge.setAttribute('variant', variant);
        else statusBadge.removeAttribute('variant');
    }

    function initClient() {
        if (client) return;

        client = new window.nVoiceClient({ serverUrl: '' });

        client.on('connected', () => {
            if (client.wakeWordEnabled && !client.isAwake) {
                setStatus('Asleep', 'warning');
            } else {
                setStatus('Connected', 'success');
            }
            stopInnerBtn.disabled = false;
            startInnerBtn.disabled = true;
            copyInnerBtn.disabled = false;
            sendInnerBtn.disabled = false;
            // Go to Sleep is only meaningful while connected & wake-armed.
            sleepInnerBtn.disabled = !client.wakeWordEnabled || !client.isAwake;
            setMicEnabled(false);
        });

        client.on('asleep', () => { setStatus('Asleep — waiting for voice', 'warning'); sleepInnerBtn.disabled = true; });
        client.on('wakeWordDetected', () => { setStatus('Awake — listening', 'success'); sleepInnerBtn.disabled = false; });
        client.on('standby', () => {
            setStatus('Standby', 'info');
            startInnerBtn.disabled = false;
            stopInnerBtn.disabled = true;
            sleepInnerBtn.disabled = true;
            sendInnerBtn.disabled = true;
            setMicEnabled(true);
        });
        client.on('disconnected', () => {
            setStatus('Disconnected');
            stopInnerBtn.disabled = true;
            startInnerBtn.disabled = false;
            sleepInnerBtn.disabled = true;
            sendInnerBtn.disabled = true;
            setMicEnabled(true);
        });
        client.on('error', (err) => { console.error('[Assistant] Error:', err); });

        // Raw transcript — same rendering as realtime page
        client.on('transcript', (msg) => {
            let finalSpan = rawDiv.querySelector('.final');
            let provSpan = rawDiv.querySelector('.provisional');
            if (!finalSpan) {
                rawDiv.innerHTML = '<span class="final"></span><span class="provisional"></span>';
                finalSpan = rawDiv.querySelector('.final');
                provSpan = rawDiv.querySelector('.provisional');
            }
            if (msg.is_command) {
                // Kimi control utterance ("ok kimi listen/stop/send") — not
                // dictation. Clear any provisional tail, append nothing.
                provSpan.textContent = '';
                return;
            }
            if (msg.is_final) {
                finalSpan.textContent += msg.text + ' ';
                rawText += msg.text.trim() + ' ';
                provSpan.textContent = '';
            } else {
                provSpan.textContent = msg.text + ' …';
            }
            rawDiv.scrollTop = rawDiv.scrollHeight;
        });

        // Assistant cleanup — locked committed text solid, provisional (unsettled) tail dimmed;
        // paragraph — mirror the break in the raw panel
        client.on('assistant', (data) => {
            console.log('[Assistant]', data.type, JSON.stringify(data));
            if (data.type === 'cleanup') {
                cleanedDiv.textContent = data.text || '';
                if (data.provisional) {
                    const p = document.createElement('span');
                    p.className = 'provisional';
                    p.textContent = ' ' + data.provisional;
                    cleanedDiv.appendChild(p);
                }
                cleanedDiv.scrollTop = cleanedDiv.scrollHeight;
                cleanupLatencyDiv.textContent = data.elapsed_ms != null ? `(${data.elapsed_ms}ms)` : '';
            } else if (data.type === 'paragraph') {
                const finalSpan = rawDiv.querySelector('.final');
                if (finalSpan) finalSpan.textContent = finalSpan.textContent.replace(/\s+$/, '') + '\n\n';
            }
        });

        client.on('telemetry', (msg) => {
            if (msg.state === 'idle/silence') {
                telemetryDiv.style.color = 'var(--text-color-dim)';
                telemetryDiv.textContent = `Listening (silence)`;
            } else {
                telemetryDiv.style.color = 'var(--color-success, #2e8b57)';
                telemetryDiv.textContent = `${msg.state} | RTF: ${msg.rtf} | Backlog: ${msg.backlog_sec}s`;
            }
        });

        // --- Kimi handsfree state machine (Phase 4) ---
        // The client is in one of sleep | command | transcribing. Surface it in
        // the badge and execute classified commands.
        client.on('kimiState', (evt) => {
            console.log('[Assistant] kimiState', evt.state);
            if (evt.state === 'sleep') {
                setStatus('Asleep — waiting for "ok kimi"', 'warning');
                sleepInnerBtn.disabled = true;
            } else if (evt.state === 'command') {
                setStatus('Awake — command? ("listen", "stop", "send"...)', 'success');
                sleepInnerBtn.disabled = false;
            } else if (evt.state === 'transcribing') {
                setStatus('Transcribing — say "ok kimi stop/send" to finish', 'success');
                sleepInnerBtn.disabled = false;
            }
        });

        client.on('kimiCommandText', (evt) => {
            // Live view of the command being captured (provisional-ish).
            telemetryDiv.textContent = `command: "${evt.text}"`;
        });

        client.on('kimiDictation', (evt) => {
            // Dictation accumulates in the raw panel automatically via 'transcript'.
            telemetryDiv.textContent = `dictation: ${evt.text.length} chars`;
        });

        client.on('kimiCommand', async (evt) => {
            console.log('[Assistant] kimiCommand', JSON.stringify(evt));
            if (evt.action === 'listen') {
                setStatus('Transcribing — say "ok kimi stop" to finish', 'success');
            } else if (evt.action === 'stop') {
                // Stop transcribing and clean up the captured dictation via the LLM.
                const text = (evt.dictation || '').trim();
                setStatus(text ? 'Stopped — cleaning…' : 'Stopped — nothing to clean. Asleep — waiting for "ok kimi"', text ? 'info' : 'warning');
                if (text) await cleanDictation(text);
            } else if (evt.action === 'send') {
                // Submit the accumulated dictation to the LLM and speak the reply.
                const text = (evt.dictation || rawText).trim();
                setStatus('Sending…', 'info');
                if (text) {
                    await sendToAssistant(text);
                } else {
                    setStatus('Nothing to send. Asleep — waiting for "ok kimi"', 'warning');
                }
            }
        });
    }

    startBtn.addEventListener('click', async () => {
        initClient();
        startInnerBtn.disabled = true;
        setMicEnabled(false);
        ensureTtsCtx();   // create AudioContext during this gesture so TTS can autoplay later

        const selectedEngine = window.nvoice.activeEngine;

        if (kimiToggle.checked) {
            // "ok kimi" — worker-side acoustic detector (Phase 3). Replaces the
            // local Silero VAD: the worker runs the trained model on the streamed
            // frames and emits wake. Silero WASM is skipped entirely.
            try {
                await client.enableKimiWakeWord();
            } catch (e) {
                nui.components.dialog.alert('Kimi Wake Error', 'Error arming kimi wake: ' + e);
                startInnerBtn.disabled = false;
                kimiToggle.disabled = false;
                return;
            }
        } else if (wakeWordToggle.checked && !client.wakeWordEnabled) {
            try {
                await client.enableWakeWord('/sdk/silero_vad.onnx');
            } catch (e) {
                nui.components.dialog.alert('Wake Word Error', 'Error loading Wake Word model: ' + e);
                startInnerBtn.disabled = false;
                wakeWordToggle.disabled = false;
                return;
            }
        } else if (!wakeWordToggle.checked) {
            client.wakeWordEnabled = false;
            client.isAwake = true;
        }

        client.setAudioDevice(micSelect.value);
        client.rawAudio = rawAudioToggle.checked;
        client.engine = selectedEngine;
        // Opt into the assistant layer — the server checks ?assistant=1
        client.assistantEnabled = true;
        client.start().catch(e => console.error(e));
    });

    stopBtn.addEventListener('click', () => {
        if (client) client.disconnect();
    });

    sleepBtn.addEventListener('click', () => {
        if (client) client.sleep();
    });

    copyBtn.addEventListener('click', () => {
        const text = cleanedDiv.textContent;
        if (text) {
            navigator.clipboard.writeText(text).then(() => {
                nui.components.banner.show({
                    content: 'Transcript copied to clipboard',
                    placement: 'top',
                    priority: 'info',
                    autoClose: 2000,
                });
            });
        }
    });

    // Handsfree Phase 1 harness: send the accumulated utterance to the LLM
    // and speak the reply. The button stands in for the "ok kimi" wake word
    // until the acoustic model lands (Phase 2/3). Reused by the kimi state
    // machine for "send" and "message" commands.
    // TTS: nSpeech SDK (nspeech-client.js) on :2233 + AudioContext playback.
    // The AudioContext is created on the Start click (a real user gesture) so
    // the browser autoplay policy does not block the spoken reply — a plain
    // new Audio().play() after the transient activation expires is rejected.
    let _ttsCtx = null;
    let _ttsSrc = null;
    let _nspeechClient = null;
    async function getNSpeechClient() {
        if (!_nspeechClient) {
            const mod = await import('/sdk/nspeech-client.js');
            _nspeechClient = new mod.NSpeechClient({ baseUrl: 'http://127.0.0.1:2233' });
        }
        return _nspeechClient;
    }
    function ensureTtsCtx() {
        if (!_ttsCtx) _ttsCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (_ttsCtx.state === 'suspended') _ttsCtx.resume().catch(() => {});
        return _ttsCtx;
    }
    async function speak(text) {
        if (!text) return;
        try {
            const nspeech = await getNSpeechClient();
            const res = await nspeech.speech({ model: 'nspeech', input: text, voice: 'default', format: 'mp3', speed: 1.0 });
            const ctx = ensureTtsCtx();
            const audioBuf = await ctx.decodeAudioData(await res.arrayBuffer());
            // Cut off any currently-playing reply when a new one starts.
            if (_ttsSrc) { try { _ttsSrc.stop(); } catch (_) {} }
            const src = ctx.createBufferSource();
            src.buffer = audioBuf;
            src.connect(ctx.destination);
            _ttsSrc = src;
            src.start();
        } catch (e) {
            console.error('[Assistant] nSpeech TTS failed:', e);
        }
    }

    function addChatBubble(role, text) {
        const b = document.createElement('div');
        b.className = 'nv-chat-bubble ' + role;
        b.textContent = text;
        chatDiv.appendChild(b);
        chatDiv.scrollTop = chatDiv.scrollHeight;
        return b;
    }

    async function sendToAssistant(text) {
        if (!text) return;
        sendInnerBtn.disabled = true;
        // Render the conversation: user bubble (right) + reply bubble (left).
        addChatBubble('user', text);
        const replyBubble = addChatBubble('assistant', '…');
        try {
            const resp = await fetch('/v1/assistant/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text }),
            });
            const data = await resp.json();
            const reply = (data && data.reply) || (data && data.error && data.error.message) || 'No reply';
            replyBubble.textContent = reply;
            replyDiv.textContent = reply;
            speak(reply);
            return reply;
        } catch (e) {
            replyBubble.textContent = 'Error: ' + e.message;
            replyDiv.textContent = 'Error: ' + e.message;
            return null;
        } finally {
            sendInnerBtn.disabled = false;
        }
    }

    // "ok kimi stop" flow: clean raw STT dictation with the local LLM (remove
    // voice-command remnants + Russian misfires) and show the cleaned result.
    async function cleanDictation(text) {
        if (!text) return;
        sendInnerBtn.disabled = true;
        // Raw dictation as user bubble, cleaned result as assistant bubble.
        addChatBubble('user', text);
        const replyBubble = addChatBubble('assistant', '…');
        try {
            const resp = await fetch('/v1/assistant/clean', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text }),
            });
            const data = await resp.json();
            const cleaned = (data && data.reply) || (data && data.error && data.error.message) || 'No reply';
            replyBubble.textContent = cleaned;
            replyDiv.textContent = cleaned;
            cleanedDiv.textContent = cleaned;
            speak(cleaned);
            return cleaned;
        } catch (e) {
            replyBubble.textContent = 'Error: ' + e.message;
            replyDiv.textContent = 'Error: ' + e.message;
            return null;
        } finally {
            sendInnerBtn.disabled = false;
        }
    }

    sendBtn.addEventListener('click', () => sendToAssistant(rawText.trim()));
}
</script>
