<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>nVoice STT</title>
    <link rel="stylesheet" href="/web/css/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>nVoice STT</h1>
            <p class="lead">Realtime Speech-to-Text</p>
        </header>

        <main>
            <section class="card">
                <h2>Realtime Transcription</h2>
                <p class="help">Click to start listening. Speak and see words appear live. Click again to stop.</p>
                <div class="controls">
                    <button id="btn-record" class="btn-primary">
                        <span id="btn-icon">&#9679;</span>
                        <span id="btn-label">Start Listening</span>
                    </button>
                    <span id="record-timer" class="timer">00:00</span>
                    <span id="stream-dot" class="stream-dot"></span>
                </div>
                <div id="rec-status" class="status"></div>
                
                <div class="transcript-panels">
                    <div class="panel">
                        <label>Enhanced (LLM)</label>
                        <textarea id="rec-enhanced" rows="6" placeholder="Enhanced transcription will appear here..." readonly></textarea>
                    </div>
                    <div class="panel">
                        <label>Raw (STT)</label>
                        <textarea id="rec-raw" rows="6" placeholder="Raw transcription will appear here..." readonly></textarea>
                    </div>
                </div>
                <div id="rec-meta" class="meta"></div>
            </section>

            <section class="card">
                <h2>Upload File</h2>
                <p class="help">Upload a WAV, MP3, FLAC, OGG, or WEBM file for offline transcription.</p>
                <div class="upload-area">
                    <input type="file" id="file-input" accept="audio/*,.wav,.mp3,.flac,.ogg,.m4a,.opus,.webm">
                    <button id="btn-upload" class="btn-secondary">Transcribe</button>
                </div>
                <div id="upload-status" class="status"></div>
                <textarea id="upload-transcript" rows="4" placeholder="Transcription will appear here..." readonly></textarea>
            </section>
        </main>

        <footer>
            <p>Engine: <strong id="engine-name">...</strong> | Status: <strong id="engine-status">Checking...</strong></p>
        </footer>
    </div>
    <script src="/web/js/app.js"></script>
</body>
</html>
